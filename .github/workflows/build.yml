name: Zbuduj APK Rymownika

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rozpakuj projekt (jeśli wgrany jako ZIP)
        run: |
          if [ ! -f settings.gradle ] && [ -f rymownik-android.zip ]; then
            unzip -o rymownik-android.zip
          fi
          ls -la

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Budowanie APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Przygotuj plik
        run: cp app/build/outputs/apk/release/app-release.apk Rymownik.apk

      - name: Opublikuj do pobrania (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Rymownik 1.0 (build ${{ github.run_number }})
          body: Pobierz plik Rymownik.apk na telefon z Androidem i otwórz go, aby zainstalować.
          files: Rymownik.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Rymownik-apk
          path: Rymownik.apk
